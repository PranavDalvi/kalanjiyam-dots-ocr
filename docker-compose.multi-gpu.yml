services:
  dotsocr-gpu0:
    build: { context: ., dockerfile: Dockerfile }
    image: dotsocr-fastapi-service:latest
    container_name: dotsocr_gpu0
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: '16gb'
    environment:
      - MODEL_PATH=${HOST_MODEL_PATH:-rednote-hilab/dots.ocr}
      - PINNED_GPU_ID=0
      - GPU_COUNT=1
      - API_MAX_CONCURRENT_REQUESTS=1
      - VLLM_MAX_NUM_SEQS=1
      - GPU_MEMORY_UTILIZATION=0.90
      - MIN_FREE_VRAM_MB=${MIN_FREE_VRAM_MB:-36000}
      - GPU_MEMORY_HEADROOM_MB=${GPU_MEMORY_HEADROOM_MB:-1024}
      - FASTAPI_PORT=18887
      - VLLM_PORT=18000
      - IDLE_TIMEOUT_SECONDS=1800
    volumes: [~/.cache/huggingface:/root/.cache/huggingface, ~/.cache/weights:/root/.cache/weights, .:/workspace]
    deploy: { resources: { reservations: { devices: [{driver: nvidia, count: all, capabilities: [gpu]}] } } }

  dotsocr-gpu1:
