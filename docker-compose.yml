services:
  dotsocr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dotsocr-fastapi-service:latest
    container_name: dotsocr_api_service
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MODEL_PATH=${HOST_MODEL_PATH:-rednote-hilab/dots.ocr}
      # Keep one OCR generation on the A6000 at a time; callers can queue here.
      - API_MAX_CONCURRENT_REQUESTS=${API_MAX_CONCURRENT_REQUESTS:-8}
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-1}
      # Optional: set after benchmarking (for example, 8192 or 16384).
      - VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.90}
      # Number of independent one-GPU vLLM workers (1 through the available GPU count).
      - GPU_COUNT=${GPU_COUNT:-1}
      - IDLE_TIMEOUT_SECONDS=1800
      - FASTAPI_PORT=8887
      # Base internal vLLM port; multi-GPU workers use this port and the next ports.
      - VLLM_PORT=${VLLM_PORT:-8000}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
