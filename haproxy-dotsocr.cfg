global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 600s
    timeout server 600s

frontend dotsocr_api
    bind *:8887
    default_backend dotsocr_workers

backend dotsocr_workers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 5s fall 2 rise 2
    server gpu0 127.0.0.1:18887 check maxconn 1
    server gpu1 127.0.0.1:18888 check maxconn 1
    server gpu2 127.0.0.1:18889 check maxconn 1
    server gpu3 127.0.0.1:18890 check maxconn 1
